name: korail-auto-booking release

# Builds installers for Windows, macOS and Linux and attaches them to a GitHub Release.
#
# Three ways to run:
#   1. Push a tag:            git tag korail-v0.1.0 && git push origin korail-v0.1.0
#   2. Run workflow manually: pick the branch to build and enter the tag to create (korail-vX.Y.Z);
#      the tag is created from that branch's head when the draft release is published.
#   3. Pull requests that touch the app: builds the installers and uploads them as workflow
#      artifacts only (no tag check, no release), so packaging on all three OSes is verified
#      before a tag is ever pushed.
# For 1 and 2 the tag must match korail-auto-booking/package.json "version" (korail-v<version>),
# and the release is created as a DRAFT so it can be reviewed before it goes public.
on:
  push:
    tags: ['korail-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. korail-v0.1.0 (created from the selected branch if it does not exist)'
        required: true
        type: string
  pull_request:
    paths:
      - 'korail-auto-booking/**'
      - '.github/workflows/korail-release.yml'

# Least privilege: the build jobs run third-party install scripts and download packaging tools,
# so they get a read-only token. Only the release job may write (create the draft release).
permissions:
  contents: read

concurrency:
  # Tag/dispatch runs are keyed by tag and never cancelled; PR verification builds are keyed by
  # the PR ref and superseded by the next push.
  group: korail-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: korail-auto-booking
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --win nsis portable --x64
          - name: macos
            os: macos-latest
            args: --mac dmg zip --x64 --arm64
          - name: linux
            os: ubuntu-latest
            args: --linux AppImage --x64
    steps:
      - name: Validate release tag
        # Runs before checkout so a bad tag / dispatch input fails in seconds, not after three builds.
        if: github.event_name != 'pull_request'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          re='^korail-v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "::error::'$TAG' is not a release tag of the form korail-vX.Y.Z"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # Tag push: the tagged commit. Manual run: the head of the branch selected in the UI/API.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: korail-auto-booking/package-lock.json

      - name: Verify tag matches package.json version
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${TAG#korail-v}" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag $TAG (expected korail-v$PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build bundles
        run: npm run build

      - name: Package installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No code-signing certificates: produce unsigned installers and never try to sign/notarize.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Install Xvfb (linux smoke test)
        if: matrix.name == 'linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends xvfb

      - name: Smoke-test the packaged app (linux)
        if: matrix.name == 'linux'
        # Drives the unpacked release build (same contents as the AppImage) through login → poll → reserve → cancel
        # against the mock Korail server, so a broken asar/preload path can never ship silently.
        run: xvfb-run -a --server-args="-screen 0 1280x900x24" npm run e2e
        env:
          E2E_ELECTRON_EXECUTABLE: release/linux-unpacked/korail-auto-booking
          E2E_ELECTRON_ARGS: --no-sandbox --disable-gpu

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: |
            korail-auto-booking/release/*.exe
            korail-auto-booking/release/*.dmg
            korail-auto-booking/release/*.zip
            korail-auto-booking/release/*.AppImage
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}

  release:
    name: draft GitHub release
    # PR runs only verify packaging; a release needs a tag (pushed or entered in Run workflow).
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v8
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      - name: List installers
        run: ls -la installers

      - name: Refuse to overwrite a published release
        # A re-run for an already-published tag would silently replace installers people may have downloaded.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "::error::Release $TAG is already published; refusing to replace its installers. Delete or un-publish it first."
            exit 1
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # Where a not-yet-existing tag gets created (on publish): the exact commit these installers were built from.
          target_commitish: ${{ github.sha }}
          name: 코레일 자동예매 ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: installers/*
          body: |
            코레일+ 계정으로 지정한 날짜·시간대의 빈 좌석을 자동 예약하는 데스크탑 앱입니다.

            **설치 파일**
            - Windows: `*-win-x64.exe` (설치본) / `*-win-x64-portable.exe` (무설치) — SmartScreen 경고가 뜨면 "추가 정보 → 실행"
            - macOS: `*-mac-arm64.dmg` (Apple Silicon) / `*-mac-x64.dmg` (Intel) — 서명되지 않은 앱이므로 처음 실행 전 터미널에서 `xattr -cr "/Applications/Korail Auto Booking.app"` 실행
            - Linux: `*-linux-x86_64.AppImage` — `chmod +x` 후 실행

            결제는 이 앱이 하지 않습니다. 예약 후 결제기한 안에 코레일+ 앱에서 직접 결제하세요.
            코레일 매크로 방지 정책에 유의해 조회 간격을 넉넉히 두고 사용하세요.
